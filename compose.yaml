services:
  postgres-db:
    image: postgres:15-alpine
    container_name: first-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: first_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret123
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
